# 复制为项目根目录的 config.toml，填写 Bot Token 和 Telegram 用户 ID 后启动。
# Telegram 媒体直接回传到指定私聊，不下载或缓存媒体文件。
lang = "zh-Hans"
workers = 1
threads = 2
stream = false

[log]
level = "info"

[telegram]
token = ""

[api]
enable = false

[[storages]]
name = "回传到聊天"
type = "telegram"
enable = true
chat_id = 0 # 与下面的用户 ID 一致。
force_file = false
reuse_media = true

[[users]]
id = 0 # 替换为你的 Telegram 数字用户 ID（不是机器人 ID）。
storages = ["回传到聊天"]
blacklist = false
