name: "⭐️ 功能建议"
description: "提出新功能或现有功能的改进建议"
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        本分支支持 Telegram 媒体快速回传，并保留多存储、网站下载和解析器等功能。
        请先阅读项目首页的功能说明，再描述你的使用场景和期望效果。
  - type: textarea
    attributes:
      label: "⭐️ 功能描述"
      description: "希望增加或改进什么功能？"
      placeholder: "希望支持……"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "🌈 使用场景"
      description: "这个功能要解决什么问题？涉及哪种输入和目标存储？"
      placeholder: "当我……时，希望机器人……"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "🧐 实现建议"
      description: "可选：补充操作示例、界面建议或伪代码。"
      placeholder: "可以考虑……"
